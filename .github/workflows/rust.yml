name: Rust

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  merge_group:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  fmt:
    name: Format check
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v5
    - uses: Swatinem/rust-cache@v2
    - name: Versions
      run: cargo --version && rustc --version && cargo fmt -- --version && cargo clippy -- --version
    - run: cargo fmt --all -- --check
    - run: (cd wireless-remote && cargo fmt --all -- --check)

  clippy:
    name: Clippy check
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v5
    - run: sudo apt-get update && sudo apt-get install -y libssl-dev pkg-config libasound2-dev
    - uses: Swatinem/rust-cache@v2
    - name: Versions
      run: cargo --version && rustc --version && cargo fmt -- --version && cargo clippy -- --version
    - run: cargo clippy --all -- --deny=warnings
    - run: cargo clippy --all --no-default-features -- --deny=warnings
    - run: (cd wireless-remote && cargo clippy --all -- --deny=warnings)

  audit:
    name: Cargo audit
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v5
    - uses: actions-rust-lang/audit@v1
      with:
        file: Cargo.lock
        # RUSTSEC-2026-0009: time CVE fix requires Rust 1.88+, above current MSRV 1.85
        # See docs/decisions/002-time-cve-msrv.md
        # RUSTSEC-2026-0194/0195 (quick-xml), RUSTSEC-2025-0052 (async-std): transitive via
        # iced/winit, not fixable without an out-of-scope iced upgrade; not meaningfully
        # exploitable here. See docs/decisions/024-cargo-audit-iced-transitive-advisories.md
        ignore: RUSTSEC-2024-0384,RUSTSEC-2024-0388,RUSTSEC-2026-0009,RUSTSEC-2026-0194,RUSTSEC-2026-0195,RUSTSEC-2025-0052
    - uses: actions-rust-lang/audit@v1
      with:
        workingDirectory: wireless-remote
        file: Cargo.lock

  preview-drift:
    name: Layout previews up to date
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v5
    # xvfb provides a virtual display so the capture window can render;
    # libxkbcommon-x11-0 is the winit X11 runtime dep iced needs headless.
    - run: sudo apt-get update && sudo apt-get install -y libssl-dev pkg-config libasound2-dev xvfb libxkbcommon-x11-0
    - uses: Swatinem/rust-cache@v2
    - name: Versions
      run: cargo --version && rustc --version
    # Re-render the front-display layout previews and fail if they differ from
    # the committed PNGs (mirrors `just check-previews`, run under a virtual
    # display because the capture needs a window). If a layout's look changes,
    # run `just capture-previews` locally and commit the refreshed PNGs.
    - name: Check front-display layout previews are up to date
      run: |
        tmp="$(mktemp -d)"
        xvfb-run -a cargo run -p refbox -- --capture-previews "$tmp"
        if ! diff -rq "$tmp" refbox/resources/layout-previews; then
          echo "::error::Layout preview PNGs are stale. Run 'just capture-previews' locally and commit the result."
          exit 1
        fi
        echo "Layout previews are up to date."

  check-for-msrv:
    name: Check for MSRV
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v5
    - run: ./ci/check-msrv-present.sh

  build:
    name: Test debug on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macOS-latest]

    steps:
    - uses: actions/checkout@v5
    - if: ${{ matrix.os == 'ubuntu-latest' }}
      run: sudo apt-get update && sudo apt-get install -y libssl-dev pkg-config libasound2-dev
    - uses: Swatinem/rust-cache@v2
      with:
        workspaces: |
          . -> target
          wireless-remote -> target
          vendor/iced_winit -> target
    - name: Versions
      run: cargo --version && rustc --version && cargo fmt -- --version && cargo clippy -- --version
    - run: cargo build --all
    - run: cargo build --all
      working-directory: wireless-remote
    - run: cargo test --all
    # The vendored `iced_winit` is excluded from the workspace, so `cargo test
    # --all` does not reach it. Run its tests explicitly so a future divergence
    # there (see vendor/iced_winit/VENDORED.md) is covered. `--locked` uses the
    # committed vendor/iced_winit/Cargo.lock so this crate's independent
    # dependency resolution stays deterministic. Linux-only: the crate's default
    # features are X11/Wayland-specific and the logic under test is
    # platform-independent, so running it on windows-latest/macOS-latest too
    # would buy nothing.
    #
    # `--features program` is load-bearing: without it the module the tests live in is
    # never compiled and `cargo test` reports "0 tests, ok" — a green but empty gate,
    # which is exactly what this step did when it was first added. So this checks the
    # SAME invocation's own output for the cursor tests, rather than a second
    # `-- --list` run carrying its own copy of `--features program` that could
    # silently drift from the run line and certify a gate it never actually ran.
    - if: ${{ matrix.os == 'ubuntu-latest' }}
      name: Test the vendored iced_winit (touchscreen-tap regression gate)
      run: |
        tmp=$(mktemp)
        cargo test --manifest-path vendor/iced_winit/Cargo.toml --locked --features program 2>&1 | tee "$tmp"
        found=$(grep -c 'cursor::tests::' "$tmp" || true)
        rm -f "$tmp"
        if [ "$found" -eq 0 ]; then
          echo "::error::That run proved nothing: no cursor tests exist in the vendored iced_winit, so the touchscreen-tap regression gate is inert. Check that --features program is still passed. See vendor/iced_winit/VENDORED.md."
          exit 1
        fi
        echo "$found cursor regression tests ran."
    # The `[patch.crates-io]` redirect above stops applying the moment nothing in the
    # graph asks for `iced_winit` 0.13 any more (an iced 0.14 upgrade, say). Cargo only
    # WARNS about an unused patch — to stderr, worded "was not used in the crate graph"
    # — and the step above keeps passing because it tests the vendored crate
    # standalone. Checking stdout alone for "vendor/iced_winit" is not enough: that
    # unused-patch warning also contains the path string, so folding stderr into the
    # same text passes in exactly the case this exists to catch. So: stdout and
    # stderr are checked separately, the unused-patch warning is an explicit failure,
    # and a `cargo tree` command that errors out is a failure too, decided from its
    # exit status. Mirrors `just check-patch-applied`.
    - if: ${{ matrix.os == 'ubuntu-latest' }}
      name: Check the vendored iced_winit patch still applies
      run: |
        err_file=$(mktemp)
        status=0
        out=$(cargo tree --locked --invert iced_winit 2>"$err_file") || status=$?
        err=$(cat "$err_file")
        rm -f "$err_file"
        echo "$out"
        if [ "$status" -ne 0 ]; then
          echo "::error::'cargo tree --locked --invert iced_winit' failed to run (exit $status). Cannot verify the touchscreen-tap fix is in the binary. See vendor/iced_winit/VENDORED.md."
          echo "$err"
          exit 1
        fi
        if grep -q 'was not used in the crate graph' <<<"$err"; then
          echo "::error::cargo reported the vendored iced_winit patch was NOT used in the crate graph — the [patch.crates-io] redirect has stopped applying, so the touchscreen-tap fix is NOT in the binary. Most likely iced was upgraded and nothing depends on iced_winit 0.13 any more, or the vendored crate's own version no longer matches what the graph resolves. See vendor/iced_winit/VENDORED.md."
          echo "$err"
          exit 1
        fi
        if ! grep -q 'vendor/iced_winit' <<<"$out"; then
          echo "::error::The workspace is NOT building iced_winit from vendor/iced_winit — the [patch.crates-io] redirect has stopped applying, so the touchscreen-tap fix is NOT in the binary. Most likely iced was upgraded and nothing depends on iced_winit 0.13 any more. See vendor/iced_winit/VENDORED.md."
          exit 1
        fi
        echo "iced_winit is built from vendor/iced_winit — the touchscreen-tap fix is in the binary."

  build-ndf:
    name: Test debug without default features
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v5
    - run: sudo apt-get update && sudo apt-get install -y libssl-dev pkg-config libasound2-dev
    - uses: Swatinem/rust-cache@v2
      with:
        workspaces: |
          . -> target
          wireless-remote -> target
    - name: Versions
      run: cargo --version && rustc --version && cargo fmt -- --version && cargo clippy -- --version
    - run: cargo build --all --no-default-features
    - run: cargo build --all --no-default-features
      working-directory: wireless-remote
    - run: cargo test --all --no-default-features

  build-release:
    name: Test release on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macOS-latest]

    steps:
    - uses: actions/checkout@v5
    - if: ${{ matrix.os == 'ubuntu-latest' }}
      run: sudo apt-get update && sudo apt-get install -y libssl-dev pkg-config libasound2-dev
    - uses: Swatinem/rust-cache@v2
      with:
        workspaces: |
          . -> target
          wireless-remote -> target
    - name: Versions
      run: cargo --version && rustc --version && cargo fmt -- --version && cargo clippy -- --version
    - run: cargo build --release --all
    - run: cargo build --release --all
      working-directory: wireless-remote
    - run: cargo test --release --all

  build-release-ndf:
    name: Test release without default features
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v5
    - run: sudo apt-get update && sudo apt-get install -y libssl-dev pkg-config libasound2-dev
    - uses: Swatinem/rust-cache@v2
      with:
        workspaces: |
          . -> target
          wireless-remote -> target
    - name: Versions
      run: cargo --version && rustc --version && cargo fmt -- --version && cargo clippy -- --version
    - run: cargo build --release --all --no-default-features
    - run: cargo build --release --all --no-default-features
      working-directory: wireless-remote
    - run: cargo test --release --all --no-default-features
            
