[workspace]
resolver = "2"

members = [
  "alphagen",
  "fonts",
  "led-panel-sim",
  "matrix-drawing",
  "overlay",
  "overlay-bridge",
  "refbox",
  "schedule-processor",
  "uwh-common",
  "wireless-modes",
]

exclude = [
  "wireless-remote",
  "vendor/iced_winit",
]

# `iced_winit` is vendored so a fix could be applied to it: iced 0.13 shares one
# cursor position between mouse and touch, and a compositor restoring the pointer
# after a touch discarded the tap. The vendored copy now carries that fix. See
# vendor/iced_winit/VENDORED.md.
[patch.crates-io]
iced_winit = { path = "vendor/iced_winit" }
