[package]
name = "overlay-bridge"
version = "0.4.9"
authors = ["Atlantis Sports <maintainers@atlantissports.org>"]
edition = "2024"
rust-version = "1.85"

[dependencies]
clap = { version = "4", features = ["derive"] }
futures = "0.3"
serde_json = "1"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread"], default-features = false }
uwh-common = { version = "0.4", path = "../uwh-common" }
