[package]
name = "overlay-bridge"
version = "0.4.9"
authors = ["Atlantis Sports <maintainers@atlantissports.org>"]
edition = "2024"
rust-version = "1.85"

[dependencies]
clap = { version = "4", features = ["derive"] }
futures = "0.3"
# Same version and feature set as `overlay`'s own use of reqwest (it talks to the same portal
# endpoints), so this does not add a new library to the workspace's dependency graph -- it is
# already resolved in Cargo.lock.
reqwest = { version = "0.12", features = ["gzip"] }
serde_json = "1"
# Already in the workspace's dependency tree via tokio's own "net" feature; adding it directly
# here (with the "all" feature) is a feature flag on an existing transitive dependency, not a new
# library. Used to configure per-socket TCP keepalive (see feed.rs), which tokio's own API does
# not expose.
socket2 = { version = "0.6", features = ["all"] }
# Same version and feature set as `overlay`'s (and `uwh-common`'s own) use of `time`, so this does
# not add a new feature combination to the workspace's dependency graph -- it is already resolved
# in Cargo.lock. Used in tables.rs to parse the ISO 8601 start time the portal returns and render
# it as the `HH:MM` the overlay itself displays.
time = { version = "0.3", features = ["local-offset", "macros", "serde", "serde-human-readable"] }
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "sync", "time"], default-features = false }
uwh-common = { version = "0.4", path = "../uwh-common" }

[dev-dependencies]
# "io-util" (AsyncWriteExt, for tests that act as the refbox side of a socket) and "test-util"
# (paused/advanced virtual time, so reconnect-retry tests don't burn real wall-clock seconds) are
# both test-only: Cargo's resolver only unifies these into the "tokio" used by test/bench targets
# of this crate, not into the plain library/binary build.
tokio = { version = "1", features = ["io-util", "test-util"], default-features = false }
