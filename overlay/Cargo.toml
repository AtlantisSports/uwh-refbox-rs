[package]
name = "overlay"
version = "0.5.1"
edition = "2024"
# grafton-ndi (behind the optional "ndi" feature below) requires 1.87; bumped from 1.85
# because that dependency is Windows/vMix-specific to this crate, discussed and approved
# for overlay only.
rust-version = "1.87"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
alphagen = {path="../alphagen"}
clap = { version = "4.5.39", features = ["derive"] }
coarsetime = "0.1.36"
confy = "1.0"
crossbeam-channel = "0.5.15"
directories = "6.0.0"
futures = "0.3"
grafton-ndi = { version = "1.0", optional = true }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "rayon"] }
log = "0.4.27"
log-panics = { version = "2", features = ["with-backtrace"]}
log4rs = { version = "1", default-features = false, features = ["background_rotation", "compound_policy", "console_appender", "fixed_window_roller", "gzip", "pattern_encoder", "rolling_file_appender", "size_trigger"]}
macroquad = { version = "0.4", default-features = false }
reqwest = {version = "0.12", features = ["gzip"]}
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1" }
time = { version = "0.3", features = ["local-offset", "macros", "serde", "serde-human-readable"] }
tokio = { version = "1.45", features = ["io-util", "macros", "net", "rt-multi-thread", "sync"] }
uwh-common = { path = "../uwh-common/" }

[features]
# Sends the rendered overlay out as an NDI video stream with a real transparency
# channel, for vMix (or any other NDI-aware software) to read directly instead of
# screen-capturing the window. Requires the NDI SDK to be installed on the build
# machine (https://ndi.video/for-developers/ndi-sdk/download/) since grafton-ndi links
# against it. Off by default so `cargo build --all` in CI keeps working on machines
# that don't have the NDI SDK installed.
ndi = ["dep:grafton-ndi"]
# Reads live game state from an overlay-bridge instance's `GET /game` feed over HTTP
# instead of connecting to the refbox directly. Leaves `network.rs`'s direct-refbox
# path completely untouched -- this swaps in `bridge_network.rs` alongside it. Off by
# default so existing direct-to-refbox behaviour is unaffected unless opted into.
bridge = []
