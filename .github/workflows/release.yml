name: Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build-windows:
    name: Build release on windows-latest
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v5
    - uses: Swatinem/rust-cache@v2
    - name: Versions
      run: cargo --version && rustc --version && cargo fmt -- --version && cargo clippy -- --version
    - run: cargo build --release --bin refbox
    - uses: actions/upload-artifact@v4
      with:
        name: refbox-windows
        path: target/release/refbox.exe

  build-macos-arm:
    name: Build release on macos-latest for arm target
    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v5
    - uses: Swatinem/rust-cache@v2
    - name: Install cargo-bundle from crates.io
      uses: baptiste0928/cargo-install@v3
      with:
        crate: cargo-bundle
    - name: Versions
      run: cargo --version && rustc --version && cargo fmt -- --version && cargo clippy -- --version && cargo bundle --version
    # cargo-bundle globs the `icon` path from `[package.metadata.bundle]` against
    # the PROCESS working directory, not the package root — it calls glob::glob
    # on the raw pattern with no join. Run from `refbox/` so
    # `resources/AppIcon.png` resolves; from the workspace root it matched
    # nothing and the icon was dropped SILENTLY (no warning), which is why the
    # app has never had one. The bundle still lands under the workspace
    # `target/` because cargo-bundle takes its output directory from
    # `cargo metadata`. `--format osx` skips the .dmg we build and never ship.
    - name: Bundle the macOS app
      working-directory: refbox
      run: cargo bundle --release --target aarch64-apple-darwin --format osx
    - name: Verify the bundle carries its icon
      run: |
        APP='target/aarch64-apple-darwin/release/bundle/osx/refbox.app'
        ls "$APP/Contents/Resources/"*.icns
        grep -q CFBundleIconFile "$APP/Contents/Info.plist"
    - uses: actions/upload-artifact@v4
      with:
        name: refbox-macos-arm
        path: target/aarch64-apple-darwin/release/bundle/osx/refbox.app

  build-macos-x86:
    name: Build release on macos-latest for x86 target
    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v5
    - uses: Swatinem/rust-cache@v2
    - name: Install cargo-bundle from crates.io
      uses: baptiste0928/cargo-install@v3
      with:
        crate: cargo-bundle
    - name: Versions
      run: cargo --version && rustc --version && cargo fmt -- --version && cargo clippy -- --version && cargo bundle --version
    - run: rustup target add x86_64-apple-darwin
    # Run from `refbox/` so the bundle icon path resolves, and skip the unused
    # .dmg — see the arm job above for why.
    - name: Bundle the macOS app
      working-directory: refbox
      run: cargo bundle --release --target x86_64-apple-darwin --format osx
    - name: Verify the bundle carries its icon
      run: |
        APP='target/x86_64-apple-darwin/release/bundle/osx/refbox.app'
        ls "$APP/Contents/Resources/"*.icns
        grep -q CFBundleIconFile "$APP/Contents/Info.plist"
    - uses: actions/upload-artifact@v4
      with:
        name: refbox-macos-x86
        path: target/x86_64-apple-darwin/release/bundle/osx/refbox.app

  build-rpi:
    name: Build release on linux for aarch64 (Raspberry Pi)
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v5
    - uses: Swatinem/rust-cache@v2
    - name: Install cross from crates.io
      uses: baptiste0928/cargo-install@v3
      with:
        crate: cross
    - name: Versions
      run: cargo --version && rustc --version && cargo fmt -- --version && cargo clippy -- --version && cross --version
    - run: cross build --release --target aarch64-unknown-linux-gnu -p refbox
    - uses: actions/upload-artifact@v4
      with:
        name: refbox-rpi
        path: target/aarch64-unknown-linux-gnu/release/refbox
    - name: Compute SHA-256 checksum
      run: |
        sha256sum target/aarch64-unknown-linux-gnu/release/refbox | awk '{print $1}' \
          > target/aarch64-unknown-linux-gnu/release/refbox.sha256
    - uses: actions/upload-artifact@v4
      with:
        name: refbox-rpi-sha256
        path: target/aarch64-unknown-linux-gnu/release/refbox.sha256

  # The overlay ships on refbox's release as separate assets -- it has no self-update
  # of its own, so a person copies the binary to the streaming machine by hand.
  # Deliberately NOT added to refbox.zip: docs/release-checklist.md asserts on that
  # zip's exact contents, and mixing the two blurs what "the refbox" is.
  build-overlay-rpi:
    name: Build the overlay for aarch64 (Raspberry Pi)
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v5
    - uses: Swatinem/rust-cache@v2
    - name: Install cross from crates.io
      uses: baptiste0928/cargo-install@v3
      with:
        crate: cross
    - name: Versions
      run: cargo --version && rustc --version && cross --version
    - run: cross build --release --target aarch64-unknown-linux-gnu -p overlay
    - uses: actions/upload-artifact@v4
      with:
        name: overlay-rpi
        path: target/aarch64-unknown-linux-gnu/release/overlay
    - name: Compute SHA-256 checksum
      run: |
        sha256sum target/aarch64-unknown-linux-gnu/release/overlay | awk '{print $1}' \
          > target/aarch64-unknown-linux-gnu/release/overlay.sha256
    - uses: actions/upload-artifact@v4
      with:
        name: overlay-rpi-sha256
        path: target/aarch64-unknown-linux-gnu/release/overlay.sha256

  upload-release:
    name: Upload release artifacts
    runs-on: ubuntu-latest

    needs: [build-windows, build-macos-arm, build-macos-x86, build-rpi, build-overlay-rpi]

    steps:
    - uses: actions/download-artifact@v5
      with:
        name: refbox-windows
        path: 'release/Windows'
    - uses: actions/download-artifact@v5
      with:
        name: refbox-macos-arm
        path: 'release/Mac (Arm processor)/refbox.app'
    - uses: actions/download-artifact@v5
      with:
        name: refbox-macos-x86
        path: 'release/Mac (Intel processor)/refbox.app'
    - uses: actions/download-artifact@v5
      with:
        name: refbox-rpi
        path: 'release/Raspberry Pi'
    - uses: actions/download-artifact@v5
      with:
        name: refbox-rpi-sha256
        path: 'release/rpi-sha256'
    # Into overlay-release/, NOT release/ -- release/ is what becomes refbox.zip.
    - uses: actions/download-artifact@v5
      with:
        name: overlay-rpi
        path: 'overlay-release/Raspberry Pi'
    - uses: actions/download-artifact@v5
      with:
        name: overlay-rpi-sha256
        path: 'overlay-release/Raspberry Pi'
    # Artifact upload/download normalises every file to 0644, which leaves the
    # macOS app bundles and the Pi binary unrunnable: macOS reports "The
    # application refbox can't be opened". Restore the executable bit before
    # zipping. chmod fails loudly if a path is ever wrong, so a future layout
    # change cannot silently ship an unrunnable build again.
    - name: Restore executable permissions
      run: |
        chmod +x 'release/Mac (Arm processor)/refbox.app/Contents/MacOS/refbox'
        chmod +x 'release/Mac (Intel processor)/refbox.app/Contents/MacOS/refbox'
        chmod +x 'release/Raspberry Pi/refbox'
    # Artifact upload/download normalises every file to 0644. A ZIP preserves the
    # executable bit; a bare release asset cannot, because GitHub serves assets as
    # opaque HTTP blobs with no Unix mode. So overlay.zip is the copy that arrives
    # runnable, and the loose binary below always needs `chmod +x` -- that is
    # expected and documented, not a defect.
    #
    # Folder naming matches refbox's own, so Windows/macOS overlay builds are
    # additive later.
    - name: Package the overlay
      run: |
        chmod +x 'overlay-release/Raspberry Pi/overlay'
        cd overlay-release && zip -r ../overlay.zip .
    - name: Stage standalone overlay assets
      run: |
        cp 'overlay-release/Raspberry Pi/overlay' overlay-aarch64-linux
        cp 'overlay-release/Raspberry Pi/overlay.sha256' overlay-aarch64-linux.sha256
    - name: Download PDFs from Google Drive
      run: |
        curl -L "https://drive.usercontent.google.com/download?id=1Momxds_2oyPTEZHgcuSxnTxI_HbGeaN8&export=download" -o "release/Getting Started Guide - English.pdf"
        curl -L "https://drive.usercontent.google.com/download?id=13eHCCmBH-IEUwIODaqpbbz_LiZQBBh0p&export=download" -o "release/Getting Started Guide - Spanish (Guía de Inicio).pdf"
        curl -L "https://drive.usercontent.google.com/download?id=1sJTdKHKjul6Pa7eV44APEQBFaxwQSvYy&export=download" -o "release/Providing App Credentials - English.pdf"
        curl -L "https://drive.usercontent.google.com/download?id=1skrUYTEYBgHs4T-dl3AobwklfJR3ZGE1&export=download" -o "release/Refbox User Manual.pdf"
        curl -L "https://drive.usercontent.google.com/download?id=1FLtJwc8gb5vuSRVPUNLxKhT1ufcOSa-w&export=download" -o "release/Refbox User Manual with Fouls.pdf"
    - name: Zip release
      run: cd release && zip -r ../refbox.zip .
    - uses: actions/download-artifact@v5
      with:
        name: refbox-rpi
        path: pi-standalone
    - name: Stage standalone Pi assets
      run: |
        cp pi-standalone/refbox refbox-aarch64-linux
        cp release/rpi-sha256/refbox.sha256 refbox-aarch64-linux.sha256
    - uses: softprops/action-gh-release@v2
      with:
        files: |
          refbox.zip
          refbox-aarch64-linux
          refbox-aarch64-linux.sha256
          overlay.zip
          overlay-aarch64-linux
          overlay-aarch64-linux.sha256
        draft: true
        generate_release_notes: true
